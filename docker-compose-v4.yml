services:
  backend:
    image: cloudlink2/fps-backend:3.0.30-beta
    container_name: flux-control-plane
    restart: unless-stopped
    environment:
      HTTP_ADDR: 0.0.0.0:6365
      DB_PATH: /app/data/gost.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?BOOTSTRAP_PASSWORD is required}
    expose:
      - "6365"
    volumes:
      - sqlite_data:/app/data
    networks:
      - gost-network
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:6365/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: cloudlink2/fp-frontend:3.0.30-beta
    container_name: vite-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ingress:
    image: caddy:2.8.4-alpine
    container_name: flux-ingress
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN is required}
    ports:
      - "${PANEL_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${PANEL_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${PANEL_BIND_ADDRESS:-0.0.0.0}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  sqlite_data:
    name: sqlite_data
    driver: local
  caddy_data:
    name: flux_caddy_data
    driver: local
  caddy_config:
    name: flux_caddy_config
    driver: local

networks:
  gost-network:
    name: gost-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
