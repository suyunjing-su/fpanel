name: Build and Push Images Based on Version

env:
  VERSION: "3.0.27-beta"

on:
  push:
    branches:
      - beta

concurrency:
  group: flux-release-3.0.27-beta
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Immutable Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
      should_build: ${{ steps.check-tag.outputs.should_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require a new release version
        id: check-tag
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Release version ${VERSION} already exists; published assets are immutable."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-gost:
    name: Build GOST Binaries
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23'
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum

      - name: Test GOST control integration
        run: |
          go -C go-gost test ./...
          go -C go-gost/x test ./...

      - name: Build GOST binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C go-gost build -trimpath -ldflags="-s -w" -o gost-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C go-gost build -trimpath -ldflags="-s -w" -o gost-arm64

      - name: Upload GOST binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gost-binaries
          if-no-files-found: error
          retention-days: 1
          path: |
            ./go-gost/gost-amd64
            ./go-gost/gost-arm64

  build-vite:
    name: Build and Push Vite Frontend
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json

      - name: Check frontend
        working-directory: ./vite-frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Vite Docker image
        id: build
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file frontend-metadata.json \
            --push \
            -t "cloudlink2/fp-frontend:build-${GITHUB_SHA}" \
            ./vite-frontend
          digest=$(jq -r '."containerimage.digest"' frontend-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build and Push Go Control Plane
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23'
          cache-dependency-path: springboot-backend/go.sum

      - name: Test Go control plane
        working-directory: ./springboot-backend
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Go control plane image
        id: build
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file backend-metadata.json \
            --push \
            -t "cloudlink2/fps-backend:build-${GITHUB_SHA}" \
            ./springboot-backend
          digest=$(jq -r '."containerimage.digest"' backend-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create Immutable Release
    needs: [check-version, build-gost, build-vite, build-backend]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Download GOST binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gost-binaries
          path: ./downloaded

      - name: Prepare release assets and checksums
        env:
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-vite.outputs.digest }}
        run: |
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          CADDY_DIGEST=$(docker buildx imagetools inspect caddy:2.8.4-alpine --format '{{.Manifest.Digest}}')
          [[ "$CADDY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          mkdir release
          install -m 0755 ./downloaded/gost-amd64 ./release/gost-amd64
          install -m 0755 ./downloaded/gost-arm64 ./release/gost-arm64
          install -m 0755 ./install.sh ./release/install.sh
          install -m 0755 ./panel_install.sh ./release/panel_install.sh
          install -m 0644 ./docker-compose-v4.yml ./release/docker-compose-v4.yml
          install -m 0644 ./docker-compose-v6.yml ./release/docker-compose-v6.yml
          install -m 0644 ./Caddyfile ./release/Caddyfile

          for compose_file in ./release/docker-compose-v4.yml ./release/docker-compose-v6.yml; do
            sed -i \
              -e "s|cloudlink2/fps-backend:${{ needs.check-version.outputs.version }}|cloudlink2/fps-backend@${BACKEND_DIGEST}|" \
              -e "s|cloudlink2/fp-frontend:${{ needs.check-version.outputs.version }}|cloudlink2/fp-frontend@${FRONTEND_DIGEST}|" \
              -e "s|caddy:2.8.4-alpine|caddy@${CADDY_DIGEST}|" \
              "$compose_file"
            grep -Fq "cloudlink2/fps-backend@${BACKEND_DIGEST}" "$compose_file"
            grep -Fq "cloudlink2/fp-frontend@${FRONTEND_DIGEST}" "$compose_file"
            grep -Fq "caddy@${CADDY_DIGEST}" "$compose_file"
          done

          cd release
          sha256sum \
            Caddyfile \
            docker-compose-v4.yml \
            docker-compose-v6.yml \
            gost-amd64 \
            gost-arm64 \
            install.sh \
            panel_install.sh > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create, verify, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          created_release=false
          cleanup_failed_release() {
            if [[ "$created_release" == true ]]; then
              gh release delete "$VERSION" --repo "${{ github.repository }}" --cleanup-tag --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_failed_release ERR
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Release ${VERSION}" \
            --generate-notes \
            --draft
          created_release=true
          gh release upload "$VERSION" ./release/* --repo "${{ github.repository }}"
          mkdir verified-release
          gh release download "$VERSION" --repo "${{ github.repository }}" --dir verified-release
          (
            cd verified-release
            sha256sum --check SHA256SUMS
          )
          gh release edit "$VERSION" --repo "${{ github.repository }}" --draft=false
          trap - ERR
